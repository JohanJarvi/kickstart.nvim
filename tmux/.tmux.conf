# ~/.tmux.conf

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# Remap prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color / 256 color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Faster command sequences / less delay for key presses (helps vim/nvim)
set -sg escape-time 10

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Increase scrollback history
set -g history-limit 10000

# Enable mouse support (click to select pane/window, drag to resize, scroll)
set -g mouse on

# Open new windows and panes in the current pane's working directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# When a new session is created, try to cd into ~/devel/<session-name> if
# that directory exists; otherwise fall back to the directory tmux was
# originally launched from.
set-hook -g session-created 'run-shell -b "~/.tmux/scripts/session-autocd.sh \"#{session_name}\" \"#{pane_current_path}\""'

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Show session chooser sorted alphabetically by name
bind s choose-tree -Zs -O name

# Intuitive split keys (open in current path, see above for -c)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-style pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style pane resizing (prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style pane swapping (prefix + Ctrl-h/j/k/l)
bind -r C-h swap-pane -t '{left-of}'
bind -r C-j swap-pane -t '{down-of}'
bind -r C-k swap-pane -t '{up-of}'
bind -r C-l swap-pane -t '{right-of}'

# Use vi keys in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Status bar
# ---------------------------------------------------------------------------

set -g status-style bg=black,fg=white
set -g status-left-length 30
set -g status-left "#[fg=green,bold]#S #[fg=white]| "
set -g status-right "#[fg=yellow]%Y-%m-%d #[fg=white]%H:%M "
set -g status-justify centre

setw -g window-status-current-style fg=black,bg=green,bold
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Highlight active pane border
set -g pane-active-border-style fg=green,dim
set -g pane-border-style fg=white
